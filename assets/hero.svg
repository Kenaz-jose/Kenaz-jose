
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020403"/>
      <stop offset="50%" stop-color="#07110A"/>
      <stop offset="100%" stop-color="#010201"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="45%" stop-color="#39FF14"/>
      <stop offset="75%" stop-color="#B7FF9C"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>

    <pattern id="grid" width="36" height="36"
             patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none"
            stroke="#39FF14" stroke-opacity=".055"
            stroke-width=".7"/>
    </pattern>

    <filter id="glow" x="-40%" y="-50%"
            width="180%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- Segmented custom display letters -->
    <g id="K" fill="none" stroke="url(#neon)"
       stroke-width="7" stroke-linecap="square">
      <path d="M0 0V76 M0 38L33 3 M0 38L33 73"/>
      <path d="M-5 10H-1 M-5 30H-1 M-5 50H-1 M-5 70H-1"
            stroke="#39FF14" stroke-width="2"/>
    </g>

    <g id="E" fill="none" stroke="url(#neon)"
       stroke-width="7" stroke-linecap="square">
      <path d="M30 3H2V73H30 M2 38H24"/>
      <path d="M10 10H20 M10 66H20"
            stroke="#B7FF9C" stroke-width="2"/>
    </g>

    <g id="N" fill="none" stroke="url(#neon)"
       stroke-width="7" stroke-linecap="square">
      <path d="M2 73V3L34 73V3"/>
      <path d="M2 20L34 56"
            stroke="#B7FF9C" stroke-width="2"/>
    </g>

    <g id="A" fill="none" stroke="url(#neon)"
       stroke-width="7" stroke-linecap="square">
      <path d="M1 73L18 3L35 73 M7 49H29"/>
      <path d="M14 20H22"
            stroke="#B7FF9C" stroke-width="2"/>
    </g>

    <g id="Z" fill="none" stroke="url(#neon)"
       stroke-width="7" stroke-linecap="square">
      <path d="M2 3H34L2 73H34"/>
      <path d="M25 13L12 42 M12 55L7 65"
            stroke="#B7FF9C" stroke-width="2"/>
    </g>

    <g id="J" fill="none" stroke="url(#neon)"
       stroke-width="7" stroke-linecap="square">
      <path d="M32 3V57Q32 73 17 73H8Q2 73 2 61"/>
      <path d="M24 12V30"
            stroke="#B7FF9C" stroke-width="2"/>
    </g>

    <g id="O" fill="none" stroke="url(#neon)"
       stroke-width="7" stroke-linecap="square">
      <path d="M9 3H27Q34 3 34 12V64Q34 73 27 73H9Q2 73 2 64V12Q2 3 9 3Z"/>
      <path d="M10 14V28 M26 48V62"
            stroke="#B7FF9C" stroke-width="2"/>
    </g>

    <g id="S" fill="none" stroke="url(#neon)"
       stroke-width="7" stroke-linecap="square">
      <path d="M31 3H10Q2 3 2 12V29Q2 38 11 38H25Q34 38 34 47V64Q34 73 26 73H2"/>
      <path d="M12 12H22 M12 64H22"
            stroke="#B7FF9C" stroke-width="2"/>
    </g>
  </defs>

  <!-- Dark futuristic canvas -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Atmospheric light behind typography -->
  <ellipse cx="600" cy="145" rx="390" ry="85"
           fill="#39FF14" opacity=".055"
           filter="url(#softGlow)"/>

  <!-- Fine data lines -->
  <g stroke="#39FF14" stroke-width="1" opacity=".22">
    <path d="M60 90H210L230 70H290"/>
    <path d="M910 230H1030L1050 210H1140"/>
    <path d="M70 220H180"/>
    <path d="M1010 85H1135"/>
  </g>

  <!-- Name: custom futuristic letterforms -->
  <g transform="translate(315 105)"
     fill="none" stroke-linejoin="round"
     filter="url(#glow)">
    <use href="#K" x="0"/>
    <use href="#E" x="48"/>
    <use href="#N" x="96"/>
    <use href="#A" x="144"/>
    <use href="#Z" x="192"/>

    <use href="#J" x="278"/>
    <use href="#O" x="326"/>
    <use href="#S" x="374"/>
    <use href="#E" x="422"/>
  </g>

  <!-- Signal traveling through the composition -->
  <path d="M120 255H1080" stroke="#14532D"
        stroke-width="2" opacity=".7"/>

  <path d="M120 255H1080" stroke="#39FF14"
        stroke-width="2" stroke-dasharray="65 895"
        filter="url(#glow)">
    <animate attributeName="stroke-dashoffset"
             from="960" to="0" dur="4s"
             repeatCount="indefinite"/>
  </path>

  <!-- Minimal animated signal node -->
  <circle cx="120" cy="255" r="4" fill="#39FF14"
          filter="url(#glow)">
    <animate attributeName="cx"
             values="120;1080;120"
             dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values="1;.65;1"
             dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Corner geometry -->
  <g fill="none" stroke="#39FF14"
     stroke-width="1.5" opacity=".7">
    <path d="M40 75V40H75"/>
    <path d="M1125 40H1160V75"/>
    <path d="M40 245V280H75"/>
    <path d="M1125 280H1160V245"/>
  </g>

  <!-- Small green status indicators -->
  <g fill="#39FF14">
    <rect x="82" y="40" width="12" height="3" opacity=".8"/>
    <rect x="100" y="40" width="5" height="3" opacity=".35"/>
    <rect x="1095" y="277" width="12" height="3" opacity=".8"/>
    <rect x="1113" y="277" width="5" height="3" opacity=".35"/>
  </g>
</svg>
